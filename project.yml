name: ItineraryMaster
options:
  bundleIdPrefix: com.hrrymgames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ItineraryCore:
    path: Packages/ItineraryCore

targets:
  ItineraryMaster:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ItineraryCore
      - target: ShareExtension
        embed: true
    entitlements:
      path: App/ItineraryMaster.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hrrymgames.itinerarymaster
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Itinerary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Shows where you are on your route map.
        NSCameraUsageDescription: Take photos of places on your trip.
        NSPhotoLibraryAddUsageDescription: Save trip photos to your library.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.hrrymgames.itinerarymaster
            CFBundleURLSchemes:
              - itinerarymaster
        LSApplicationQueriesSchemes:
          - tiktok
          - snssdk1233
          - comgooglemaps
        AppGroupIdentifier: group.com.hrrymgames.itinerarymaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrrymgames.itinerarymaster
        PRODUCT_NAME: ItineraryMaster
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: ItineraryCore
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hrrymgames.itinerarymaster
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Itinerary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.com.hrrymgames.itinerarymaster
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrrymgames.itinerarymaster.share
        PRODUCT_NAME: ShareExtension
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  ItineraryMaster:
    build:
      targets:
        ItineraryMaster: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
